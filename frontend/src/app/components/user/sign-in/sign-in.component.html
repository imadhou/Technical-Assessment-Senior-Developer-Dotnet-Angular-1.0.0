<div class="sign-in-container">
  <div class="card">
    <div class="card-header">
      <h2>Sign In</h2>
      <p>Welcome back to Expense Manager</p>
    </div>

    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            [class.error]="email?.invalid && email?.touched"
            autocomplete="email">
          <div class="error-message" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="password?.invalid && password?.touched"
            autocomplete="current-password">
          <div class="error-message" *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">
              Password must be at least 6 characters
            </span>
          </div>
        </div>

        <!-- Error Message -->
        <div class="error-message server-error" *ngIf="errorMessage() || errorList().length">
          <!-- General message -->
          <div *ngIf="errorMessage()">{{ errorMessage() }}</div>

          <!-- Validation errors -->
          <ul *ngIf="errorList().length > 0">
            <li *ngFor="let err of errorList()">{{ err }}</li>
          </ul>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="loading() || loginForm.invalid">
          <span *ngIf="loading()">Signing In...</span>
          <span *ngIf="!loading()">Sign In</span>
        </button>
      </form>

      <div class="auth-links">
        <p>
          Don't have an account?
          <a routerLink="/auth/sign-up" class="link">Sign up here</a>
        </p>
      </div>
    </div>
  </div>
</div>
